<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R社</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: #1a1a1a;
    color: #e8e8e8;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* Hero */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .logo {
    font-family: "Times New Roman", serif;
    font-size: 6rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: #000;
    text-shadow: 0 0 1px rgba(255,255,255,0.15);
    margin-bottom: 1.5rem;
  }
  .title {
    font-size: 2.2rem;
    font-weight: 400;
    letter-spacing: 0.3em;
    margin-bottom: 1rem;
  }
  .subtitle {
    font-size: 1rem;
    color: #999;
    letter-spacing: 0.1em;
    margin-bottom: 4rem;
  }
  nav {
    display: flex;
    gap: 3rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  nav a {
    color: #ccc;
    text-decoration: none;
    font-size: 1rem;
    letter-spacing: 0.15em;
    transition: color 0.3s;
  }
  nav a:hover { color: #fff; }

  /* Sections */
  .section {
    padding: 5rem 3rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  .section h2 {
    font-size: 1.8rem;
    font-weight: 400;
    letter-spacing: 0.2em;
    margin-bottom: 2rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.2rem;
  }
  .grid-item {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    aspect-ratio: 4/3;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  .grid-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    cursor: zoom-in;
    transition: transform 0.4s ease;
  }
  .grid-item:hover img { transform: scale(1.04); }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 100;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
    transition: transform 0.15s ease-out;
    transform-origin: center center;
    user-select: none;
  }
  .lightbox .close-hint {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    color: #666;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
  }
</style>
</head>
<body>

  <div class="subtitle">每一帧都是虚构的真实。</div>
  <nav>

</section>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="">
  <div class="close-hint">滚轮缩放 · 按住左键拖动 · 点击空白处关闭</div>
</div>

<script>
  // 点击网格图片放大
  document.querySelectorAll('.grid-item img').forEach(img => {
    img.addEventListener('click', () => openLightbox(img.dataset.full));
  });

  // Lightbox
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  let scale = 1, tx = 0, ty = 0;
  let lbDrag = false, sx = 0, sy = 0;

  function apply() {
    lightboxImg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  }
  function openLightbox(src) {
    lightboxImg.src = src;
    scale = 1; tx = 0; ty = 0;
    apply();
    lightbox.classList.add('open');
  }
  lightboxImg.addEventListener('wheel', (e) => {
    e.preventDefault();
    scale = Math.min(5, Math.max(0.5, scale + (e.deltaY < 0 ? 0.2 : -0.2)));
    apply();
  }, { passive: false });
  lightboxImg.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    lbDrag = true;
    sx = e.clientX - tx;
    sy = e.clientY - ty;
    lightboxImg.style.cursor = 'grabbing';
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!lbDrag) return;
    tx = e.clientX - sx;
    ty = e.clientY - sy;
    apply();
  });
  document.addEventListener('mouseup', () => {
    lbDrag = false;
    lightboxImg.style.cursor = 'grab';
  });
  lightboxImg.style.cursor = 'grab';
  lightboxImg.addEventListener('click', (e) => e.stopPropagation());
  lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });
</script>
